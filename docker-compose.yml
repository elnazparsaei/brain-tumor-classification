version: '3.9'

services:
  brain-tumor-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    command: >
      python -m streamlit run src/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true


